<!DOCTYPE html>
<html>
<head>
    <title>Add Password - Password Manager</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .edit-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #1f3c88;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1f3c88;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #162d68;
        }

        .note {
            font-size: 13px;
            color: #666;
            margin-top: -8px;
            margin-bottom: 20px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1f3c88;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="edit-box">

        <h1>🔐 Password Manager</h1>

        <h2>Add Password</h2>

        <form method="POST">

            <label>Website:</label>
            <input
                type="text"
                name="website"
                value=""
                required
            >

            <label>Account Username:</label>
            <input
                type="text"
                name="account_username"
                value=""
                required
            >

            <label>New Password:</label>
            <input
                type="password"
                name="password_value"
                placeholder="Enter new password"
            >

            <p class="note">
                Leave blank if you don't want to change the password.
            </p>

            <button type="submit">
                Update Password
            </button>

        </form>

        <a class="back" href="/dashboard">
            ← Back to Dashboard
        </a>

    </div>

</body>
</html>
